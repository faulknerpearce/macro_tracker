# This file is intentionally minimal. It exists at the repo root so that
# Cloudflare Pages (Git integration) can discover the Pages Functions under
# /functions and build the React app from packages/web/dist.
#
# For local `wrangler pages dev` runs, use packages/web/wrangler.toml —
# both files share the same compatibility settings.
name = "macro-tracker"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "packages/web/dist"

# No [vars] here on purpose: with a [vars] block this file becomes the source of
# truth for variables and the dashboard can't edit them. Set everything in
# Cloudflare: Workers & Pages > macro-tracker > Settings > Variables and Secrets.
#
# Build-time (plain text, needed by `vite build`; the build fails if missing):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# Runtime secrets (encrypted):
#   SUPABASE_URL, SUPABASE_ANON_KEY, OAUTH_SIGNING_SECRET
#   GOOGLE_HEALTH_CLIENT_ID, GOOGLE_HEALTH_CLIENT_SECRET, INTEGRATION_ENCRYPTION_KEY
